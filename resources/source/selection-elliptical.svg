<svg width="50" height="50" viewBox="0 0 50 50"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <mask id="cut">
      <rect width="100%" height="100%" fill="white"/>

      <rect x="22" y="0"  width="6" height="6" fill="black"/>
      <rect x="22" y="44" width="6" height="6" fill="black"/>
      <rect x="0"  y="22" width="6" height="6" fill="black"/>
      <rect x="44" y="22" width="6" height="6" fill="black"/>
    </mask>
  </defs>

  <!-- Larger ellipse -->
  <ellipse
    cx="25"
    cy="25"
    rx="21"
    ry="21"
    fill="none"
    stroke="#000"
    stroke-width="1"
    stroke-dasharray="4 2"
    stroke-linecap="butt"
    mask="url(#cut)"
  />

  <!-- Flush handles -->
  <rect x="22" y="1"  width="6" height="6"
        fill="none" stroke="#000" stroke-width="1"
        shape-rendering="crispEdges"/>

  <rect x="22" y="43" width="6" height="6"
        fill="none" stroke="#000" stroke-width="1"
        shape-rendering="crispEdges"/>

  <rect x="1"  y="22" width="6" height="6"
        fill="none" stroke="#000" stroke-width="1"
        shape-rendering="crispEdges"/>

  <rect x="43" y="22" width="6" height="6"
        fill="none" stroke="#000" stroke-width="1"
        shape-rendering="crispEdges"/>

</svg>