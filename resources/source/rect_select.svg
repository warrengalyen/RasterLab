<svg xmlns="http://www.w3.org/2000/svg"
     width="50" height="50" viewBox="0 0 50 50"
     shape-rendering="crispEdges">

  <!-- Corner handles -->

  <!-- Top-left -->
  <rect x="6" y="6" width="8" height="8" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Top-right -->
  <rect x="36" y="6" width="8" height="8" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Bottom-left -->
  <rect x="6" y="36" width="8" height="8" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Bottom-right -->
  <rect x="36" y="36" width="8" height="8" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Dashed border segments -->

  <!-- Top -->
  <rect x="16" y="9" width="6" height="2" fill="#000"/>
  <rect x="24" y="9" width="6" height="2" fill="#000"/>
  <rect x="32" y="9" width="4" height="2" fill="#000"/>

  <!-- Bottom -->
  <rect x="16" y="39" width="6" height="2" fill="#000"/>
  <rect x="24" y="39" width="6" height="2" fill="#000"/>
  <rect x="32" y="39" width="4" height="2" fill="#000"/>

  <!-- Left -->
  <rect x="9" y="16" width="2" height="6" fill="#000"/>
  <rect x="9" y="24" width="2" height="6" fill="#000"/>
  <rect x="9" y="32" width="2" height="4" fill="#000"/>

  <!-- Right -->
  <rect x="39" y="16" width="2" height="6" fill="#000"/>
  <rect x="39" y="24" width="2" height="6" fill="#000"/>
  <rect x="39" y="32" width="2" height="4" fill="#000"/>

</svg>
