<svg xmlns="http://www.w3.org/2000/svg"
     width="50" height="50" viewBox="0 0 50 50"
     shape-rendering="crispEdges">

  <defs>
    <mask id="cut">
      <!-- Everything visible -->
      <rect width="100%" height="100%" fill="white"/>

      <!-- Knockout areas (centered on handles) -->
      <rect x="0.5"  y="0.5" width="8" height="8" fill="black"/>
      <rect x="41.5" y="0.5" width="8" height="8" fill="black"/>
      <rect x="0.5"  y="41.5" width="8" height="8" fill="black"/>
      <rect x="41.5" y="41.5" width="8" height="8" fill="black"/>
    </mask>
  </defs>

  <!-- Dashed border with mask -->
  <rect x="4" y="4" width="41.5" height="41.5"
        fill="none"
        stroke="#000"
        stroke-width="1"
        stroke-dasharray="6 4"
        stroke-linecap="butt"
        mask="url(#cut)"/>

  <!-- Corner Handles -->
  <rect x="0.5"  y="0.5"  width="8" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="41.5" y="0.5"  width="8" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="0.5"  y="41.5" width="8" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="41.5" y="41.5" width="8" height="8" stroke="#000" stroke-width="1" fill="none"/>

</svg>