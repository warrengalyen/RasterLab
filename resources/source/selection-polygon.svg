<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <mask id="cut">
      <rect width="100%" height="100%" fill="white"/>

      <!-- Match ellipse handle positions -->
      <rect x="3"  y="1"  width="6" height="6" fill="black"/>
      <rect x="42" y="1"  width="6" height="6" fill="black"/>
      <rect x="43" y="25" width="6" height="6" fill="black"/>
      <rect x="22" y="41" width="6" height="6" fill="black"/>
      <rect x="1"  y="25" width="6" height="6" fill="black"/>
    </mask>
  </defs>

  <!-- Polygon outline (edge-flush like ellipse) -->
  <polygon
    points="5,4 45,4 46,28 25,46 3.5,28"
    fill="none"
    stroke="#000"
    stroke-width="1"
    stroke-dasharray="4 2"
    stroke-linecap="butt"
    mask="url(#cut)"
  />

  <!-- Corner Handles -->
  <rect x="2" y="1"  width="6" height="6" fill="none" stroke="#000" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="42" y="1"  width="6" height="6" fill="none" stroke="#000" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="43" y="25" width="6" height="6" fill="none" stroke="#000" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="22" y="41" width="6" height="6" fill="none" stroke="#000" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="0.5" y="25" width="6" height="6" fill="none" stroke="#000" stroke-width="1" shape-rendering="crispEdges"/>

</svg>